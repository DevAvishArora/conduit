name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Static analysis (fast, no Docker) ──
  static:
    name: lint + typecheck + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # ── Unit tests with coverage gate ──
  unit:
    name: unit tests + coverage
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server unit tests + coverage gate
        run: pnpm test:coverage
      - name: Frontend unit tests (jsdom + React Testing Library)
        run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

  # ── Integration tests (real Postgres + Redis) ──
  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    needs: static
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate JWT keypair
        run: pnpm keygen
      - name: Prepare KEK
        run: |
          echo "SECRETS_ROOT_KEK=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> $GITHUB_ENV
      - run: pnpm test:integration
